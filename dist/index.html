        if (g === 'strep_bh' && catOf2('PEN') === 'S') setS(['AMP', 'AMX', 'CTX', 'CRO', 'FEP', 'CPT', 'MEM', 'IPM', 'ETP'], 'EUCAST Expert Rule (Streptococcus) 1: nhạy benzylpenicillin → nhạy aminopenicillin, cephalosporin, carbapenem');
        if (g === 'strep_vgs' && by.PEN && by.PEN.mic != null && (by.PEN.op === '<=' || by.PEN.op === '=') && by.PEN.mic <= 0.25) setS(['AMP', 'AMX', 'CTX', 'CRO', 'FEP', 'CXM', 'ETP', 'IPM', 'MEM'], 'EUCAST Expert Rule (Streptococcus) 2: sàng lọc benzylpenicillin âm (MIC ≤0,25) → nhạy mọi β-lactam có chỉ định');
        if (g === 'strep_vgs' && by.PEN && by.PEN.mic != null && by.PEN.mic > 0.25) euInfo('Sàng lọc benzylpenicillin dương (MIC >0,25): không suy ra kết quả β-lactam khác; dùng MIC của từng thuốc hoặc báo kháng (EUCAST Expert Rule Streptococcus 2).');
        if ((g === 'strep_bh' || g === 'strep_pn') && catOf2('ERY') === 'S' && (catOf2('CLI') === 'S')) euInfo('Nhạy cả erythromycin và clindamycin: báo nhạy mọi macrolide và lincosamide (EUCAST Expert Rule 2/3).');
        if (g === 'strep_pn' && catOf2('TCY') === 'S') setS(['DOX', 'MNO'], 'EUCAST Expert Rule (S. pneumoniae) 5: tetracycline nhạy → doxycycline, minocycline nhạy');
        if (g === 'strep_pn' && catOf2('TCY') === 'R') euInfo('Tetracycline kháng: doxycycline, minocycline báo kháng hoặc báo theo MIC riêng đã thử (EUCAST Expert Rule S. pneumoniae 5).');
        if (quals.ICR === 'POS' && (g === 'strep_bh')) euNote('info', 'Liên cầu β-tan huyết kháng clindamycin cảm ứng: clindamycin nhạy khi thử vẫn có thể dùng trong nhiễm trùng da mô mềm nhẹ, và trong phối hợp để giảm tổng hợp độc tố khi cần (vd. viêm cân mạc hoại tử do liên cầu) – EUCAST Expert Rule Streptococcus 3, mục Remarks.');
      }
      if (g === 'enterococcus') {
        if (catOf2('AMP') === 'R') force(['IPM', 'PIP', 'TZP'], 'EUCAST Expert Rule (Enterococcus) 1: ampicillin kháng → ureidopenicillin và imipenem kháng');
        if (ge === 'enterococcus' && sp === 'faecalis' && catOf2('AMP') === 'S') euInfo('E. faecalis nhạy ampicillin: thường nhạy amoxicillin (±clavulanate) và "nhạy, tăng phơi nhiễm" với piperacillin (±tazobactam); vì một số chủng kháng piperacillin dù nhạy ampicillin nên EUCAST khuyến cáo thử thuốc cần báo (Expert Rule Enterococcus 1).');
        if (catOf2('GENHL') === 'S') euInfo('Enterococcus không kháng gentamicin mức cao: báo gentamicin còn hiệp đồng với thuốc tác động thành tế bào (EUCAST Expert Rule Enterococcus 2).');
        if (catOf2('STRHL') === 'S') euInfo('Enterococcus không kháng streptomycin mức cao: báo streptomycin còn hiệp đồng (EUCAST Expert Rule Enterococcus 3).');
        if (catOf2('GENHL') === 'R') euNote('warn', 'Enterococcus kháng gentamicin mức cao: phối hợp gentamicin và các aminoglycoside khác (trừ streptomycin) với β-lactam không còn hiệp đồng; nên thử streptomycin mức cao (EUCAST Expert Rule Enterococcus 2).');
        if (catOf2('STRHL') === 'R') euNote('warn', 'Enterococcus kháng streptomycin mức cao: phối hợp streptomycin với β-lactam không còn hiệp đồng (EUCAST Expert Rule Enterococcus 3).');
        if (catOf2('VAN') === 'R' && (catOf2('TEC') === 'S')) euNote('warn', 'Enterococcus kháng vancomycin nhưng nhạy teicoplanin (vanB): kháng teicoplanin có thể xuất hiện trong lúc điều trị (EUCAST Expert Rule Enterococcus 5).');
      }
      if (g === 'haemophilus') {
        if (catOf2('TCY') === 'S') setS(['DOX', 'MNO'], 'EUCAST Expert Rule (Haemophilus) 3: tetracycline nhạy → doxycycline, minocycline nhạy');
        if (catOf2('TCY') === 'R') euInfo('Tetracycline kháng: doxycycline, minocycline báo kháng hoặc theo MIC riêng đã thử (EUCAST Expert Rule Haemophilus 3).');
      }
      if (ge === 'salmonella' && by.CIP && by.CIP.mic != null && by.CIP.mic <= 0.06 && by.CIP.op !== '>' && by.CIP.op !== '>=') euInfo('Salmonella ciprofloxacin MIC ≤0,06 mg/L: báo nhạy ciprofloxacin (và các fluoroquinolone khác có hiệu quả đã chứng minh trong nhiễm Salmonella xâm lấn) – EUCAST Expert Rule Salmonella 3.');
      if (g === 'campylobacter') {
        if (catOf2('ERY') === 'S') euNote('info', 'Campylobacter nhạy erythromycin: azithromycin và clarithromycin báo nhạy (EUCAST Expert Rule Campylobacter 1).');
        if (catOf2('ERY') === 'R') force(['AZM', 'CLR'], 'EUCAST Expert Rule (Campylobacter) 1: erythromycin kháng → azithromycin, clarithromycin kháng');
      }
      if (g === 'corynebacterium' && catOf2('ERY') === 'R' && (catOf2('CLI') === 'S' || catOf2('CLI') === 'I')) euNote('warn', 'Corynebacterium (trừ C. diphtheriae) kháng erythromycin: clindamycin có thể kháng cảm ứng; báo kháng clindamycin nếu thử cảm ứng dương (EUCAST Expert Rule Corynebacterium 1).');
      if (g === 'strep_pn' || g === 'strep_bh' || g === 'staph_aureus' || g === 'staph_sosa') { /* ICR handled with D-test hold (EUCAST Expert Rules: Staphylococcus 3, Streptococcus 3) */ }
    }

    // --- reporting decisions
    const triggerOK = (def) => {
      const t = def.trig;
      if (t === 'mrs') return mrs;
      if (t === 'mssa') return mssa;
      if (Array.isArray(t)) return t.some((id) => nonS(id));
      return false;
    };
    const addHidden = (row, kind, reason, extra) => {
      const base = HIDE_INFO[kind] || HIDE_INFO.policy; const x = extra || {};
      const tier = row.def ? row.def.tier : null;
      rep.hidden.push({ id: row.id, name: row.name, micText: row.micText, vitek: row.vitek, cat: row.cat, tier, kind, reason, risk: x.risk || base.risk, restore: x.restore || base.restore, need: x.need || '', tierText: tier == null ? '' : TT(tier) });
    };

    rows.forEach((row) => {
      const def = row.def;
      if (!def) {
        if (row.intrinsic) { addHidden(row, 'policy', `Kháng tự nhiên của ${org.raw || 'vi khuẩn này'} (Appendix B): CLSI không báo thường quy; nếu có thử thì báo kháng.`, { restore: 'blocked', risk: 'Kết quả ra nhạy ở thuốc kháng tự nhiên thường do lỗi định danh hoặc lỗi thử nghiệm; báo ra có thể dẫn đến thất bại điều trị.' }); return; }
        if (G.suppress && G.suppress.includes(row.id)) { addHidden(row, 'policy', G.suppressText, { restore: 'blocked', risk: 'Thuốc có thể tỏ ra nhạy in vitro nhưng không hiệu quả lâm sàng; báo nhạy có thể dẫn đến thất bại điều trị.' }); return; }
        if ((G.noBp || []).includes(row.id) || DRUGS[row.id]) addHidden(row, 'nobp', `Không có breakpoint CLSI M100-Ed36 cho ${G.label}; không diễn giải theo CLSI (Vitek có thể dùng tiêu chuẩn khác như FDA/EUCAST).`);
        return;
      }
      if (row.noMic && !def.bp) return;
      if (!row.cat && row.ambiguous && !row.intrinsic && !def.hlar) { addHidden(row, 'qc', `MIC ${row.micText} cắt ngang breakpoint (${row.ambiguous.join('/')}) của ${standard === 'eucast' ? 'EUCAST' : 'CLSI'}, không phân loại chắc chắn được.`, { restore: 'blocked', need: 'Cần MIC chính xác (thử lại bằng thẻ hoặc phương pháp có dải nồng độ phù hợp).', risk: 'Báo S/I/R khi MIC chưa đủ chính xác có thể sai nhóm nhạy/kháng.' }); return; }
      if (def.euNone) { addHidden(row, 'nobp', `EUCAST v16.0 không có breakpoint (ghi "IE", "-" hoặc chỉ nêu trong ghi chú) cho thuốc này ở nhóm "${G.label}"; không diễn giải. Vitek có thể dùng tiêu chuẩn khác.`); return; }
      row.noExport = !!(def.menRow && spec !== 'csf');
      if (def.nonMen && spec === 'csf') { addHidden(row, 'policy', 'Chủng từ dịch não tủy: chỉ báo ngưỡng viêm màng não (Table 2G comments 10, 14).', { restore: 'blocked', risk: 'Ngưỡng không viêm màng não cao hơn nhiều; báo cho dịch não tủy có thể dẫn đến thiếu liều điều trị viêm màng não.' }); return; }
      if (row.czoNotCovered) { addHidden(row, 'policy', 'Breakpoint cefazolin của CLSI chỉ áp dụng cho E. coli, K. pneumoniae và P. mirabilis (Table 1A-1, Table 2A-1 comments 17–18).', { restore: 'blocked', risk: 'Áp breakpoint ngoài loài CLSI đã xác lập sẽ diễn giải sai.' }); return; }
      if (def.tier === 0) {
        const msg = standard === 'eucast' ? 'Có breakpoint EUCAST nhưng thuốc không nằm trong danh sách báo cáo mặc định của app (EUCAST không quy định danh sách này); lấy lại khi cần.'
          : (row.id === 'QDA') ? 'Quinupristin-dalfopristin chỉ báo cho MSSA, không nằm trong Table 1C.'
          : 'Có breakpoint ở Table 2 nhưng không nằm trong Table 1: CLSI không khuyến cáo báo thường quy.';
        if (row.id === 'QDA' && mssa && !hide.has(row.id)) { /* still not in Table 1 */ }
        addHidden(row, 'policy', msg); return;
      }
      if (def.hideIf) { const hx = def.hideIf(org, spec); if (hx) { addHidden(row, hx.kind || 'policy', hx.reason, { restore: hx.restore, risk: hx.risk }); return; } }
      if (def.onlyMSSA && !mssa) { addHidden(row, 'policy', 'Chỉ báo cho MSSA (Table 2C).', { risk: 'Dữ liệu chỉ xác lập cho MSSA; báo cho MRSA dễ gây hiểu nhầm là còn dùng được.' }); return; }
      if (def.onlyEcoli && !isEcoli) { addHidden(row, 'policy', 'Fosfomycin chỉ báo cho E. coli (Table 1A-1 fn f).', { restore: 'blocked', risk: 'Breakpoint fosfomycin của CLSI chỉ có cho E. coli ở đường tiết niệu.' }); return; }
      // specimen rules
      if (def.urine === 'only' && spec !== 'urine') { addHidden(row, 'specimen', spec === 'unknown' ? 'Kháng sinh chỉ báo cho mẫu nước tiểu; bệnh phẩm chưa xác định nên đang ẩn.' : 'Kháng sinh chỉ báo cho mẫu nước tiểu (Table 1).', { risk: 'Thuốc chỉ đạt nồng độ hữu hiệu ở nước tiểu, không đạt ở máu hoặc mô. Báo cho mẫu khác nước tiểu có thể bị dùng điều trị nhiễm khuẩn huyết hoặc nhiễm trùng mô, dẫn đến thất bại điều trị.' }); return; }
      if (def.urine === 'not' && spec === 'urine') { addHidden(row, 'specimen', 'Không báo thường quy cho chủng phân lập từ đường tiết niệu (Table 1).', { risk: 'CLSI không báo thường quy thuốc này cho nước tiểu; báo ra dễ khiến chọn thuốc không phù hợp cho nhiễm khuẩn tiết niệu.' }); return; }
      if (def.notLRT && spec === 'lrt') { addHidden(row, 'specimen', 'Không báo thường quy cho mẫu đường hô hấp dưới (daptomycin).', { risk: 'Daptomycin bị chất surfactant ở phổi bất hoạt: xét nghiệm có thể ra "nhạy" nhưng điều trị viêm phổi thất bại.' }); return; }
      if (row.id === 'CLI' && cliHold) { addHidden(row, 'qc', 'Erythromycin kháng và clindamycin nhạy/trung gian: phải có kết quả test ICR (D-test/BMD) trước khi báo clindamycin (Table 2C comment 23).', { need: 'Nhập kết quả D-test ở mục "Việc cần làm".', risk: 'Nếu bỏ sót kháng clindamycin cảm ứng, bệnh nhân dùng clindamycin có thể thất bại điều trị dù báo "nhạy".' }); return; }
      if (row.id === 'PEN' && penHold) { addHidden(row, 'qc', 'S. aureus MIC penicillin ≤0,12: CLSI yêu cầu test β-lactamase (zone-edge) trước khi báo nhạy (Table 2C comment 9; Table 3G).', { need: 'Nhập kết quả test β-lactamase ở mục "Việc cần làm".', risk: 'MIC không phát hiện được β-lactamase cảm ứng; báo nhạy có thể dẫn đến thất bại điều trị bằng penicillin.' }); return; }
      if (row.id === 'PEN' && mrs && !force.has('PEN')) { addHidden(row, 'policy', 'MRS: CLSI cho phép báo penicillin là kháng hoặc không báo; đã gộp vào nhận xét MRSA.', { risk: 'Không có nguy cơ lâm sàng đáng kể nếu báo là KHÁNG; chỉ làm dài bảng.' }); return; }
      if (hide.has(row.id)) { addHidden(row, 'manual', 'Đã ẩn thủ công.'); return; }

      // tier logic
      let show = false, why = '';
      if (def.tier === 1) show = true;
      else if (force.has(row.id)) { show = true; why = 'manual'; }
      else if (def.tier === 2) {
        if (settings.tier2 === 'always') { show = true; why = 'always'; }
        else if (settings.tier2 === 'cascade' && triggerOK(def)) { show = true; why = 'cascade'; }
        else if (row.cat === 'R') { show = true; why = 'rAlways'; }
        else addHidden(row, 'cascade', settings.tier2 === 'hide' ? 'Tier 2: đang ẩn theo cài đặt.' : 'Tier 2: chỉ báo theo cascade của BV; chưa đủ điều kiện kích hoạt.');
      } else if (def.tier === 3) {
        if (settings.mdro && triggerOK(def)) { show = true; why = 'cascade'; }
        else if (row.cat === 'R') { show = true; why = 'rAlways'; }
        else addHidden(row, 'tier3', settings.mdro ? 'Tier 3: chưa đủ điều kiện cascade.' : 'Tier 3: chỉ thử/báo ở BV phục vụ bệnh nhân nguy cơ MDRO cao, theo cascade.');
      } else if (def.tier === 4) {
        if (settings.tier4) { show = true; why = 'request'; }
        else addHidden(row, 'tier4', 'Tier 4: chỉ báo khi bác sĩ lâm sàng yêu cầu (khi các thuốc ở tier khác không phù hợp).');
      }
      if (!show) { rep._skipped = rep._skipped || []; return; }
      const nsTrig = Array.isArray(def.trig) ? def.trig.filter((id) => nonS(id)).map(drugName) : [];
      const tw = why === 'cascade' ? `Mở theo cascade vì ${def.trig === 'mrs' ? 'chủng là MRS/MRSA' : def.trig === 'mssa' ? 'chủng là MSSA' : nsTrig.join(', ') + ' không nhạy'}.`
        : why === 'rAlways' ? 'Kết quả KHÁNG của thuốc Tier 2–3 luôn được báo theo CLSI, kể cả khi chưa đủ điều kiện cascade.'
        : why === 'always' ? 'Đang báo thường quy theo cài đặt của bệnh viện.'
        : why === 'manual' ? 'Kỹ thuật viên thêm thủ công.'
        : why === 'request' ? 'Báo theo yêu cầu của bác sĩ lâm sàng.'
        : def.tier === 1 ? 'Báo thường quy.' : '';
      rep.reported.push({ ...row, tier: def.tier, why, tierText: TT(def.tier), tierWhy: tw });
    });

    // order reported by group order
    const ord = (id) => { const k = G.order.indexOf(id); return k < 0 ? 999 : k; };
    rep.reported.sort((a, b) => a.tier - b.tier || ord(a.id) - ord(b.id));
    rep.hidden.sort((a, b) => (a.tier || 9) - (b.tier || 9) || ord(a.id) - ord(b.id));

    // --- Vitek vs CLSI discrepancies (all rows, reported or not)
    rows.forEach((row) => {
      if (!row.cat && row.ambiguous) {
        rep.qc.push({ level: 'warn', text: `${row.name} ${row.micText}: giá trị MIC cắt ngang breakpoint (${row.ambiguous.join('/')}), không phân loại chắc chắn; cần MIC chính xác.` });
        return;
      }
      if (!row.cat || !row.vitek || row.intrinsic || row.noMic) return;
      if (!['S', 'I', 'R'].includes(row.vitek)) return;
      const c = row.cat;
      if (c !== row.vitek && !(row.vitek === 'I' && c === 'SDD')) {
        const hard = (c === 'S' && row.vitek === 'R') || (c === 'R' && row.vitek === 'S');
        rep.qc.push({ level: hard ? 'warn' : 'info', text: `${row.name} ${row.micText}: Vitek diễn giải ${row.vitek}, CLSI M100-Ed36 diễn giải ${c}. Báo cáo dùng kết quả CLSI.` });
        row.vitekDiffers = true;
      } else if (row.vitek === 'I' && c === 'SDD') {
        rep.qc.push({ level: 'info', text: `${row.name} ${row.micText}: Vitek ghi I, CLSI phân loại SDD (nhạy phụ thuộc liều).` });
      }
    });
    if (by.CTX && by.CRO && by.CTX.cat && by.CRO.cat && by.CTX.cat !== by.CRO.cat) rep.qc.push({ level: 'info', text: 'Cefotaxime và ceftriaxone cho kết quả khác loại (breakpoint giống nhau): cân nhắc thử lại.' });
    if (org.group === 'enterobacterales') {
      const cs = ['ETP', 'IPM', 'MEM'].filter((i) => by[i] && by[i].cat);
      if (cs.some((i) => by[i].cat === 'S') && cs.some((i) => by[i].cat === 'R') && !PMP(org)) rep.qc.push({ level: 'warn', text: 'Carbapenem cho kết quả S lẫn R trong cùng chủng: kiểm tra lại và thử carbapenemase.' });
    }
    if (iso.unknown && iso.unknown.length) rep.qc.push({ level: 'info', text: `Dòng chưa nhận diện từ PDF: ${iso.unknown.map((u) => `${u.name} (${u.raw})`).join('; ')}.` });

    // --- footnotes assembled from reported agents (+ notes)
    const used = [];
    const useFn = (k) => { if (FN[k] && !used.includes(k)) used.push(k); };
    rep.reported.forEach((r) => {
      const keys = [];
      (r.def.fn || []).forEach((k0) => {
        let k = k0;
        if (k.endsWith('?')) {
          k = k.slice(0, -1);
          if (k === 'ent_ampc' && !AMPC_GENERA(org)) return;
          if (k === 'ent_tzp_sdd' && r.cat !== 'SDD') return;
          if (k === 'ent_imp_pm' && !PMP(org)) return;
          if (k === 'st_pen_s' && r.cat !== 'S') return;
          if (k === 'vgs_rx' && !(r.cat === 'I')) return;
          if (k === 'sal_fq' && !(r.cat === 'I' || r.cat === 'R')) return;
          if (k === 'eu_bracket' && !r.def.bracket) return;
          if (k === 'enc_lnz' && org.species !== 'faecalis') return;
          if (k === 'sbh_gbs' && org.species !== 'agalactiae') return;
        }
        if (k === 'st_cli' && !(by.ERY && by.ERY.cat === 'R' && r.cat !== 'R')) return;
        keys.push(k);
      });
      if (standard === 'clsi') {
        if (r.icr) keys.push('st_cli_ind');
        if (r.id === 'OXA' && mrs) keys.unshift('st_mrs');
        if (r.id === 'PEN' && mrs) keys.push('st_pen_r');
      }
      if (standard === 'eucast' && r.bp && r.bp.noS && !keys.includes('eu_offscale')) keys.push('eu_offscale');
      r.fnKeys = keys;
      keys.forEach(useFn);
    });
    rep.notes.forEach((n) => { if (n.fn) useFn(n.fn); });
    // dose
    let anyDose = false;
    rep.reported.forEach((r) => {
      const d = r.def.dose;
      r.dose = null;
      if (!d) return;
      if (r.cat === 'S' && d.s) r.dose = { kind: 'S', text: d.s };
      else if (r.cat === 'SDD' && d.sdd) r.dose = { kind: 'SDD', text: d.sdd };
      else if (standard === 'eucast' && r.cat === 'I' && d.high) r.dose = { kind: 'I', text: d.high };
      else if (standard !== 'eucast' && r.cat === 'I' && (r.id === 'ETP' || r.id === 'IPM' || r.id === 'MEM')) r.dose = { kind: 'I', text: `${d.s} (mức I: cân nhắc liều tối đa, truyền kéo dài; hội chẩn truyền nhiễm)` };
      if (r.dose) anyDose = true;
    });
    if (standard === 'eucast' && rep.reported.some((r) => r.cat === 'I')) useFn('eu_I');
    if (anyDose) useFn(standard === 'eucast' ? 'eu_dose' : 'dose_general');
    const ordered = used.filter((k) => k !== 'dose_general' && k !== 'eu_dose').concat(used.includes('dose_general') ? ['dose_general'] : []).concat(used.includes('eu_dose') ? ['eu_dose'] : []);
    rep.footnotes = ordered.map((k, i) => ({ n: i + 1, key: k, text: FN[k][0], ref: FN[k][1] }));
    const nOf = (k) => { const f = rep.footnotes.find((x) => x.key === k); return f ? f.n : null; };
    rep.reported.forEach((r) => { r.fnNums = (r.fnKeys || []).map(nOf).filter(Boolean); if (r.dose) r.fnNums.push(nOf(standard === 'eucast' ? 'eu_dose' : 'dose_general')); r.fnNums = [...new Set(r.fnNums)].sort((a, b) => a - b); });
    rep.notes.forEach((n) => { if (n.fn) n.fnNum = nOf(n.fn); });

    const rightInner = (H.accreditation ? para(run(H.accreditation, { b: true, sz: 16 }), { align: 'right', after: 20 }) : '') + bcPara + (sid ? para(run(`SID: ${sid}`, { b: true, sz: 21 }), { align: 'right' }) : '');
    const rightCell = cell(wR, rightInner || para(''), { valign: 'top' });
    out.push(table([wL, wM, wR], [row([leftCell, midCell, rightCell])], { noBorders: true }));
    out.push(para(run('PHIẾU KẾT QUẢ KHÁNG SINH ĐỒ', { b: true, sz: 28 }), { align: 'center', before: 60, after: 0 }));
    out.push(para(run('ANTIMICROBIAL SUSCEPTIBILITY TEST REPORT', { b: true, sz: 20 }), { align: 'center', after: 50 }));

    // ---- patient block (4 columns, borderless)
    const cw = [3000, 1953, 3000, 1953];
    const lab = (vi, en_) => cell(cw[0], para(T(vi + '/ ', { sz: 18 }) + T(en_ + ':', { sz: 18 })), { valign: 'top' });
    const val = (t, w, bold) => cell(w, para(T(t || '', { b: bold !== false, sz: 19 })), { valign: 'top' });
    const R2 = (a1, a2, b1, b2, v1, v2) => row([lab(a1, a2), val(v1, cw[1]), lab(b1, b2), val(v2, cw[3])]);
    out.push(table(cw, [
      R2('Họ tên', 'Patient Name', 'Giới tính', 'Sex', m.name, m.sex === 'NAM' ? 'Nam' : (m.sex === 'NỮ' ? 'Nữ' : m.sex)),
      R2('Điện thoại', 'Phone', 'Tuổi', 'Age', m.phone, m.age == null ? '' : String(m.age)),
      R2('Địa chỉ', 'Address', 'Khoa', 'Department', m.address, m.dept),
      R2('Chẩn đoán sơ bộ', 'Preliminary diagnosis', 'BS chỉ định', 'Requesting doctor', m.diagnosis, m.reqDoctor),
      R2('Loại bệnh phẩm', 'Type of sample', 'Ngày lấy mẫu', 'Sampling date', m.spec, m.date),
      R2('Tình trạng mẫu', 'Sample status', 'Giờ nhận mẫu', 'Receiver time', m.sampleStatus, m.recvTime),
      R2('Người lấy mẫu', 'Sampling', 'Mã BN', 'Patient ID', m.sampler, m.patientId),
      R2('Người nhận mẫu', 'Receiver', 'Số phiếu', 'Lab ID', m.receiver, m.labId),
    ], { noBorders: true }));
    out.push(para('', { after: 40 }));

    if (rep.unsupported) out.push(para(run('Chưa áp bảng CLSI/EUCAST cho vi khuẩn này: kết quả dưới đây là diễn giải gốc của Vitek, chưa lọc theo tiêu chuẩn.', { b: true, color: '8A5A00', sz: 18 }), { after: 60, shade: 'FCEFC7' }));

    // ---- result table (gold header, black grid)
    const showMic = en.showMic !== false, showBp = en.showBp !== false;
    const hasUnit = showMic || showBp;
    const wIns = 950, wUnit = hasUnit ? 800 : 0, wRes = 1750, wBp = showBp ? 2300 : 0, wMic = showMic ? 950 : 0;
    const wName = W - wIns - wUnit - wRes - wBp - wMic;
    const widths = [wName].concat(showMic ? [wMic] : []).concat([wRes]).concat(showBp ? [wBp] : []).concat(hasUnit ? [wUnit] : []).concat([wIns]);
    const head = (vi, en_, w, al) => cell(w, para(run(vi, { b: true, sz: 19 }) + runBr() + run(`(${en_})`, { sz: 15 }), { align: al || 'center' }), { fill: GOLD });
    const heads = [head('TÊN KHÁNG SINH', 'ANTIBIOTIC', wName, 'left')];
    if (showMic) heads.push(head('MIC', 'MIC', wMic));
    heads.push(head('KẾT QUẢ', 'RESULT', wRes));
    if (showBp) heads.push(head('NGƯỠNG DIỄN GIẢI', 'BREAKPOINT', wBp));
    if (hasUnit) heads.push(head('ĐƠN VỊ', 'UNIT', wUnit));
    heads.push(head('MÁY XN', 'INS', wIns));
    const span = widths.length;
    const body = [];
    body.push(row([cell(W, para(run('VI SINH ', { b: true, sz: 20 }) + run('(MICROBIOLOGY)', { sz: 16 })), { span })]));
    body.push(row([cell(W, para(run('Kháng sinh đồ – vi khuẩn phân lập: ', { b: true, sz: 20 }) + run(m.organism || '(chưa rõ vi khuẩn)', { b: true, i: true, sz: 20 }) + run(`  [${H.instrument} · ${stdLabel}]`, { sz: 16 })), { span })]));
    const items = rep.unsupported ? (rep.raw || []).map((r) => ({ name: r.name, micText: r.mic, cat: r.vitek, bp: null, fnNums: [] })) : rep.reported;
    items.forEach((r) => {
      const sup = en.showFn !== false && r.fnNums && r.fnNums.length ? run(r.fnNums.join(','), { sup: true, color: TEAL, b: true }) : '';
      const cs = [cell(wName, para(run(r.name, { b: true, sz: 21 }) + sup))];
      if (showMic) cs.push(cell(wMic, para(T(String(r.micText == null ? '' : r.micText)), { align: 'center' })));
      cs.push(resultCell(wRes, r.cat, std));
      if (showBp) cs.push(cell(wBp, para(run(r.bp ? E.bpText(r.bp) : '—', { sz: 17 }), { align: 'center' })));
      if (hasUnit) cs.push(cell(wUnit, para(run('µg/mL', { sz: 17 }), { align: 'center' })));
      cs.push(cell(wIns, para(run(H.instrument, { sz: 17 }), { align: 'center' })));
      body.push(row(cs));
    });
    if (!items.length) body.push(row([cell(W, para(run('Không có kháng sinh nào đủ điều kiện báo cáo.', { color: INK2 })), { span })]));
    out.push(table(widths, [row(heads, { header: true })].concat(body), { borderColor: '000000' }));

    // ---- notes
    if (!rep.unsupported && rep.clinical && rep.clinical.length) {
      out.push(para('', { after: 60 }));
      const inner = para(run('LƯU Ý ', { b: true, sz: 20 }) + run('/ Notes', { sz: 18 }), { after: 20 })
        + rep.clinical.map((n) => para(run(n.text, { color: n.level === 'alert' ? 'B3261E' : '000000', b: n.level === 'alert', sz: 19 }), { num: 1, after: 20 })).join('');
      out.push(table([W], [row([cell(W, inner, { valign: 'top', borders: `<w:left ${BLK(24)}/>` })])], { borderColor: '000000' }));
    }
    const tr = rep.treatment;
    if (en.showFn !== false && !rep.unsupported && ((rep.footnotes && rep.footnotes.length) || tr)) {
      out.push(para(run(`CHÚ THÍCH ${std === 'eucast' ? 'EUCAST' : 'CLSI'} `, { b: true, sz: 20 }) + run('/ References', { sz: 18 }), { keepNext: true, before: 90, after: 20 }));
      (rep.footnotes || []).forEach((f) => out.push(para(run(`${f.n}.\t`, { sz: 15 }) + run(f.text, { sz: 15 }) + run(` (${f.ref})`, { sz: 13, color: INK2 }), { ind: 'w:left="340" w:hanging="340"', after: 0, tabs: '<w:tab w:val="left" w:pos="360"/>' })));
      if (tr && tr.doses && tr.doses.length) {
        out.push(para(run('LIỀU THAM CHIẾU ', { b: true, sz: 17 }) + run('/ Reference dosage', { sz: 15 }), { keepNext: true, before: 40, after: 6 }));
        out.push(para(run(tr.doseNote, { sz: 13, color: INK2 }), { after: 6 }));
        tr.doses.forEach((d) => out.push(para(run(d.name, { b: true, sz: 15 }) + run(` (${d.kind}): ${d.text}`, { sz: 15 }), { num: 1, after: 0 })));
      }
      if (tr) {
        out.push(para(run('NGUY CƠ KHÁNG TRONG LÚC ĐIỀU TRỊ ', { b: true, sz: 17 }) + run('/ Resistance during therapy', { sz: 15 }), { keepNext: true, before: 40, after: 6 }));
        (tr.emergence || []).forEach((e) => out.push(para(run(e.text, { sz: 15 }) + run(` (${e.ref})`, { sz: 13, color: INK2 }), { num: 1, after: 0 })));
        out.push(para(run(tr.general, { sz: 15 }) + run(` (${tr.generalRef})`, { sz: 13, color: INK2 }), { num: 1, after: 0 }));
      }
    }
    const legend = std === 'eucast'
      ? 'S: nhạy, liều chuẩn (Susceptible, standard dosing) · I: nhạy, tăng phơi nhiễm (Susceptible, increased exposure) · R: kháng (Resistant).'
      : 'S: nhạy (Susceptible) · I: trung gian (Intermediate) · SDD: nhạy phụ thuộc liều (Susceptible-dose dependent) · R: kháng (Resistant) · NS: không nhạy (Non-susceptible).';
    out.push(para(run(legend + ' Chữ in nghiêng và gạch chân là kết quả kháng.', { sz: 15, color: '222222' }), { before: 40, after: 20 }));

    // ---- signatures (technician | time | chief)
    const sw = [3300, 3306, 3300];
    const when = (String(m.approvedAt || '').match(/^(\d{2}\/\d{2}\/\d{4})\s+(\d{2}:\d{2})/) || []);
    out.push(table(sw, [
      row([
        cell(sw[0], para(run('NGƯỜI THỰC HIỆN', { b: true, sz: 19 }), { align: 'center', keepNext: true }) + para(run('Technician', { i: true, sz: 18 }), { align: 'center', keepNext: true })),
        cell(sw[1], para(run('Giờ: ', { sz: 19 }) + run(when[2] || '', { b: true, sz: 19 }) + run('    Ngày: ', { sz: 19 }) + run(when[1] || '', { b: true, sz: 19 }), { align: 'center' }), { valign: 'top' }),
        cell(sw[2], para(run('TRƯỞNG KHOA XN', { b: true, sz: 19 }), { align: 'center', keepNext: true }) + para(run('Chief Laboratory Officer', { i: true, sz: 18 }), { align: 'center', keepNext: true })),
      ]),
      row([cell(sw[0], para('')), cell(sw[1], para('')), cell(sw[2], para(''))], { height: 300 }),
      row([cell(sw[0], para(run(en.reviewer || '', { b: true, sz: 19 }), { align: 'center' })), cell(sw[1], para(run(stdLabel, { sz: 16, color: INK2 }), { align: 'center' })), cell(sw[2], para(run(H.chief || '', { b: true, sz: 19 }), { align: 'center' }))]),
    ], { noBorders: true }));
    return out.join('');
  }

  /* ----- package ----- */
  const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
  const STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:eastAsia="${FONT}" w:cs="${FONT}"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:lang w:val="vi-VN" w:eastAsia="vi-VN" w:bidi="ar-SA"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="252" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:uiPriority w:val="99"/><w:semiHidden/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style><w:style w:type="paragraph" w:styleId="Footer"><w:name w:val="footer"/><w:basedOn w:val="Normal"/><w:rPr><w:sz w:val="16"/><w:color w:val="56636B"/></w:rPr></w:style></w:styles>`;
  const NUMBERING = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="•"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="400" w:hanging="260"/></w:pPr><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/></w:rPr></w:lvl></w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num></w:numbering>`;

  function footerXml(H, label) {
    const fld = (code) => `<w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText xml:space="preserve"> ${code} </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:t>1</w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r>`;
    const gold = `<w:pBdr><w:top w:val="single" w:sz="12" w:space="4" w:color="${GOLD}"/></w:pBdr>`;
    const line1 = `<w:p><w:pPr><w:pStyle w:val="Footer"/>${gold}</w:pPr><w:r><w:rPr><w:b/><w:sz w:val="17"/></w:rPr><w:t xml:space="preserve">${esc(H.name)}</w:t></w:r></w:p>`;
    const contact = [H.address, H.phone && 'ĐT: ' + H.phone, H.web].filter(Boolean).join(' · ');
    const line2 = contact ? `<w:p><w:pPr><w:pStyle w:val="Footer"/></w:pPr><w:r><w:t xml:space="preserve">${esc(contact)}</w:t></w:r></w:p>` : '';
    const line3 = `<w:p><w:pPr><w:pStyle w:val="Footer"/><w:tabs><w:tab w:val="right" w:pos="${W}"/></w:tabs></w:pPr><w:r><w:t xml:space="preserve">${esc(label)}</w:t></w:r><w:r><w:tab/></w:r><w:r><w:t xml:space="preserve">Trang </w:t></w:r>${fld('PAGE')}<w:r><w:t xml:space="preserve"> / </w:t></w:r>${fld('NUMPAGES')}</w:p>`;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:ftr ${NS}>${line1}${line2}${line3}</w:ftr>`;
  }

  /** entries: array of entry objects -> Uint8Array (.docx) */
  function buildDocx(entries, opts) {
    const o = opts || {};
    const li = logoInfo();
    DOCPR = 0;
    const imgs = [];
    const bodyXml = entries.map((en, i) => entryXml(en, i, li, imgs)).join('');
    const sect = `<w:sectPr><w:footerReference w:type="default" r:id="rIdFooter"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="560" w:right="1000" w:bottom="900" w:left="1000" w:header="360" w:footer="240" w:gutter="0"/></w:sectPr>`;
    const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document ${NS}><w:body>${bodyXml}${para('')}${sect}</w:body></w:document>`;
    const std = entries[0] && entries[0].rep && entries[0].rep.standardLabel;
    const files = [
      { name: '[Content_Types].xml', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>' },
      { name: '_rels/.rels', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>' },
      { name: 'docProps/core.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${esc(o.title || 'Kết quả kháng sinh đồ')}</dc:title><dc:creator>${esc(o.author || 'Bệnh viện Đa khoa Lãnh Binh Thăng')}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().replace(/\.\d+Z$/, 'Z')}</dcterms:created></cp:coreProperties>` },
      { name: 'word/_rels/document.xml.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdNum" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/><Relationship Id="rIdFooter" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>${li ? '<Relationship Id="rIdLogo" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.png"/>' : ''}${imgs.map((im) => `<Relationship Id="${im.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${im.name}"/>`).join('')}</Relationships>` },
      { name: 'word/document.xml', text: doc },
      { name: 'word/styles.xml', text: STYLES },
      { name: 'word/numbering.xml', text: NUMBERING },
      { name: 'word/footer1.xml', text: footerXml(Object.assign({}, HOSP_DEF, (entries[0] && entries[0].hospital) || {}), `Thực hiện bằng ${((entries[0] && entries[0].hospital) || HOSP_DEF).instrument || 'Vitek 2'}`) },
    ];
    if (li) files.push({ name: 'word/media/logo.png', data: li.bytes });
    imgs.forEach((im) => files.push({ name: 'word/' + im.name, data: im.bytes }));
    return KS.zip(files);
  }

  const api = { buildDocx };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.ASTDocx = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* OCR trong trình duyệt cho phiếu scan/ảnh chụp (Tesseract.js). Ảnh và văn bản không gửi đi đâu:
 * chỉ tải thư viện và mô hình ngôn ngữ (tiếng Anh + tiếng Việt) từ CDN ở lần dùng đầu tiên.
 * Độ chính xác của OCR đổi theo độ phân giải (đã thấy sót dòng hoặc nhầm ký tự ở một số mức),
 * nên mỗi trang được đọc ba lần ở ba độ phân giải gần nhau; việc gộp và cảnh báo nằm ở engine (mergeReads). */
(function (root) {
  'use strict';
  const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  // Cạnh dài của ảnh đưa vào OCR (px). Đã đo trên phiếu thật khổ A4 với Tesseract.js: 2400 đọc đủ 11/11 dòng, 2000 và 2200 sót 1 dòng,
  // 1800 sót 3 dòng, 1400 nhầm ≤ thành <, còn 2800 trở lên đọc hỏng bảng. Vì vậy đọc ba lần quanh mức 2400 rồi gộp (biểu quyết).
  const PASS_SIZES = [2400, 2200, 2000];
  let workerP = null;
  let status = () => {};

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      if (root.Tesseract) return resolve();
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Không tải được bộ OCR (cần internet ở lần dùng đầu). Có thể dùng ô "Dán văn bản".'));
      document.head.appendChild(s);
    });
  }

  // một bước OCR treo (mạng chậm, CDN bị chặn, worker không khởi động) phải báo lỗi chứ không được để app quay mãi
  function withTimeout(promise, ms, msg) {
    let t;
    return Promise.race([promise, new Promise((_, rej) => { t = setTimeout(() => rej(new Error(msg)), ms); })]).finally(() => clearTimeout(t));
  }

  function getWorker() {
    if (workerP) return workerP;
    workerP = withTimeout((async () => {
      await loadScript(TESS_URL);
      status('đang tải mô hình OCR tiếng Việt + Anh (lần đầu có thể mất vài chục giây)…');
      const w = await root.Tesseract.createWorker(['eng', 'vie'], 1, {
        logger: (m) => { if (m && m.status === 'recognizing text' && typeof m.progress === 'number') status(`đang đọc ${Math.round(m.progress * 100)}%`); },
      });
      await w.setParameters({ preserve_interword_spaces: '1' });
      return w;
    })(), 180000, 'Bộ OCR không khởi động được sau 3 phút (mạng chậm hoặc CDN jsdelivr/tessdata bị chặn). Có thể dùng ô "Dán văn bản".');
    workerP.catch(() => { workerP = null; });
    return workerP;
  }

  async function recognize(canvas, psm) {
    const w = await getWorker();
    await w.setParameters({ tessedit_pageseg_mode: String(psm) });
    const r = await withTimeout(w.recognize(canvas), 180000, 'OCR một trang quá 3 phút, đã dừng.');
    return (r && r.data && r.data.text) || '';
  }

  function newCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    return c;
  }
  const release = (c) => { try { c.width = 1; c.height = 1; } catch (e) { /* ignore */ } };

  function rotate(canvas, deg) {
    const c = document.createElement('canvas');
    c.width = canvas.height; c.height = canvas.width;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.translate(c.width / 2, c.height / 2); ctx.rotate((deg * Math.PI) / 180);
    ctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
    return c;
  }

  /* Trả về danh sách trang; mỗi trang có render(longSide) -> canvas. */
  async function openPages(file) {
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    if (isPdf) {
      const lib = root.pdfjsLib;
      if (!lib) throw new Error('Thư viện đọc PDF chưa tải được (kiểm tra mạng).');
      const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
      const pages = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        pages.push({
          async render(longSide) {
            const v1 = page.getViewport({ scale: 1 });
            const scale = longSide / Math.max(v1.width, v1.height);
            const vp = page.getViewport({ scale });
            const c = newCanvas(vp.width, vp.height);
            await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
            return c;
          },
        });
      }
      return pages;
    }
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Không mở được ảnh.')); i.src = url; });
    return [{
      async render(longSide) {
        const k = longSide / Math.max(img.naturalWidth, img.naturalHeight);
        const c = newCanvas(img.naturalWidth * k, img.naturalHeight * k);

      },

  /* opts: { onStatus(text), score(text) -> số dòng kháng sinh đọc được }.

  async function read(file, opts) {
    opts = opts || {};
    status = opts.onStatus || (() => {});
    const score = opts.score || (() => 1);
    const pages = await openPages(file);
    const texts = [];
    let preview = '';
    try {
      for (let k = 0; k < PASS_SIZES.length; k++) {
        let joined = '';

          status(`lần đọc ${k + 1}/${PASS_SIZES.length}, trang ${p + 1}/${pages.length}…`);
          const canvas = await pages[p].render(PASS_SIZES[k]);
          if (k === 0 && p === 0) {
            const pv = newCanvas(canvas.width * (1400 / Math.max(canvas.width, canvas.height)), canvas.height * (1400 / Math.max(canvas.width, canvas.height)));

          // PSM 4 (một cột, kích thước đổi) đọc bảng sạch nhất khi thử; nếu ít dòng thì thử PSM 6 rồi 3
          let best = await recognize(canvas, 4), bestScore = score(best);
          for (const psm of [6, 3]) {

            const t = await recognize(canvas, psm); const sc = score(t);
            if (sc > bestScore) { best = t; bestScore = sc; }
          }
          // ảnh chụp bị xoay: chỉ thử khi chưa đọc được dòng nào
          if (bestScore === 0 && k === 0) {
            for (const deg of [90, 270]) {
              const rc = rotate(canvas, deg);
              const t = await recognize(rc, 4); release(rc);
              const sc = score(t);
              if (sc > bestScore) { best = t; bestScore = sc; }
            }
          }
          joined += best + '\n';
          release(canvas);
        }
        texts.push(joined);
      }
    } finally {
      pages.forEach((pg) => { if (pg.done) pg.done(); });
    }
    return { texts, preview };
  }

  async function close() {
    if (!workerP) return;
    try { const w = await workerP; await w.terminate(); } catch (e) { /* ignore */ }
    workerP = null;
  }

  root.AstOCR = { read, close, PASS_SIZES };
